worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 25m;

    # Per-client shared counters across Nginx workers. The deployment must
    # preserve the real client address; see web-deployment.md before enabling
    # real_ip_header behind a load balancer.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=auth_register:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=auth_logout:10m rate=12r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    upstream nextgen_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # The TLS-terminating ingress forwards to this private listener.
        # The edge ingress must reject direct public access to port 8080.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /api/session/login {
            limit_req zone=auth_login burst=2 nodelay;
            proxy_pass http://nextgen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/backend/auth/register {
            limit_req zone=auth_register burst=1 nodelay;
            proxy_pass http://nextgen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/session/logout {
            limit_req zone=auth_logout burst=3 nodelay;
            proxy_pass http://nextgen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://nextgen_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
